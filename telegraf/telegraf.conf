[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# MQTT subscriber — reads from the same broker as npm run serve
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["plantwise/sensors/+/moisture"]
  qos = 1
  data_format = "json"
  json_string_fields = []
  # Extract device_id from topic position 2 (0-indexed)
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "plantwise/sensors/+/moisture"
    measurement = "_/_/_/measurement"
    tags = "_/_/device_id/_"

# InfluxDB v2 output
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
