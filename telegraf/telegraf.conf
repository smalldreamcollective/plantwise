[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# MQTT subscriber — reads from the same broker as npm run serve
# Topic format: plantwise/sensors/<device_id>/<sensor_id>/moisture
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["plantwise/sensors/+/+/moisture"]
  qos = 1
  data_format = "json"
  json_string_fields = ["device_id", "sensor_id", "version"]
  tagexclude = ["topic", "host"]
  # Extract device_id and sensor_id from topic segments (0-indexed)
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "plantwise/sensors/+/+/moisture"
    measurement = "_/_/_/_/measurement"
    tags = "_/_/device_id/sensor_id/_"

# Convert moisture_pct from float (JSON default) to integer to match InfluxDB schema
[[processors.converter]]
  [processors.converter.fields]
    integer = ["moisture_pct"]

# InfluxDB v2 output
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
